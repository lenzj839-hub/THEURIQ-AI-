<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050611">
  <meta name="description" content="THEURIQ-AI Intelligence Studio - Ask anything, build anything">
  <title>THEURIQ-AI</title>
  <style>
    :root{
      --bg:#050611; --panel:rgba(255,255,255,0.06);
      --border:rgba(255,255,255,0.12); --accent:#7c5cff; --accent-2:#00e5ff;
      --text:#ffffff; --muted:#a1a1b8;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      min-height:100vh; overflow-x:hidden; position:relative;
    }
    body::before{
      content:""; position:fixed; inset:0; z-index:-3;
      background:
        radial-gradient(600px 400px at 15% 5%, rgba(124,92,255,.38), transparent 60%),
        radial-gradient(500px 400px at 85% 15%, rgba(0,229,255,.22), transparent 60%),
        radial-gradient(700px 500px at 50% 110%, rgba(255,61,138,.18), transparent 60%),
        linear-gradient(180deg,#050611 0%,#080916 50%,#050611 100%);
    }
    body::after{
      content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
      background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size:44px 44px;
      mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);
    }
    .app-container{max-width:780px;margin:0 auto;padding:0 16px 90px;position:relative;z-index:1}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
    .brand{display:flex;align-items:center;gap:10px}
    .brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#7c5cff,#00e5ff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;box-shadow:0 0 25px rgba(124,92,255,.6)}
    .brand-name{font-weight:800;letter-spacing:.5px;font-size:17px}
    .icon-button{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer}
    .welcome-area{padding-top:28px;text-align:center}
    .welcome-label{font-size:11px;letter-spacing:2px;color:var(--muted);font-weight:700;margin-bottom:12px}
    .welcome-area h1{font-size:34px;line-height:1.15;font-weight:800;background:linear-gradient(90deg,#fff,#a78bfa,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent}
    .welcome-area p{color:var(--muted);margin-top:12px;font-size:15px;line-height:1.5}
    .composer{margin-top:24px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:12px;backdrop-filter:blur(16px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
    .composer textarea{width:100%;background:transparent;border:none;outline:none;color:#fff;font-size:15px;resize:none;font-family:inherit;padding:4px}
    .composer textarea::placeholder{color:#8b8b9e}
    .composer-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
    .composer-tools{display:flex;align-items:center;gap:12px}
    .tool-button{background:rgba(255,255,255,.08);border:1px solid var(--border);color:#fff;padding:7px 12px;border-radius:999px;font-size:13px;cursor:pointer}
    .model-label{font-size:11px;letter-spacing:.5px;color:#c4c4d6;font-weight:600}
    .send-button{width:38px;height:38px;border-radius:50%;border:none;background:#fff;color:#000;font-size:18px;cursor:pointer;font-weight:700}
    .explore-section{margin-top:28px;text-align:left}
    .explore-section h2{font-size:12px;letter-spacing:2px;color:var(--muted);margin-bottom:12px}
    .capability-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .capability-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;color:#fff;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;text-align:left;backdrop-filter:blur(12px)}
    .capability-card:active{transform:scale(.97)}
    .capability-icon{font-size:18px}
    .conversation{margin-top:20px;display:flex;flex-direction:column;gap:12px}
    .bottom-navigation{position:fixed;bottom:0;left:0;right:0;background:rgba(5,6,17,.9);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:10}
    .bottom-nav-item{background:none;border:none;color:#8b8b9e;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:12px}
    .bottom-nav-item.active{color:#fff}
    .bottom-nav-item span{font-size:18px}
    #notification{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#fff;color:#000;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    @media(min-width:600px){ .welcome-area h1{font-size:44px} .welcome-area{padding-top:50px} }
  </style>
</head>
<body>
<div class="app-container">
  <header class="topbar">
    <div class="brand"><div class="brand-logo">T</div><div class="brand-name">THEURIQ-AI</div></div>
    <button id="menuToggle" onclick="showToast('THEURIQ-AI v1.0 - Built by John')" class="icon-button" aria-label="Open menu">☰</button>
  </header>
  <main class="main-content">
    <section class="welcome-area" id="welcomeArea">
      <div class="welcome-content">
        <div class="welcome-label">YOUR INTELLIGENT ASSISTANT</div>
        <h1>What can I help you build?</h1>
        <p>Ask anything. Explore ideas.<br>Create something amazing.</p>
      </div>
      <div class="composer" id="composer">
        <textarea id="messageInput" placeholder="Ask THEURIQ anything..." rows="2"></textarea>
        <div class="composer-footer">
          <div class="composer-tools">
            <button id="attachButton" onclick="showToast('Attach - chagua file (coming soon)')" class="tool-button" type="button">＋ <span>Attach</span></button>
            <span class="model-label">AI MODEL: AUTO</span>
          </div>
          <button id="sendButton" onclick="sendMsg()" class="send-button" type="button" aria-label="Send message">↑</button>
        </div>
      </div>
      <section class="explore-section">
        <h2>EXPLORE</h2>
        <div class="capability-grid">
          <button class="capability-card" onclick="pickPrompt('Help me write code for a software project')" data-prompt="Help me write code for a software project"><span class="capability-icon">⌘</span><span>Coding</span></button>
          <button class="capability-card" onclick="pickPrompt('Help me research a topic')" data-prompt="Help me research a topic"><span class="capability-icon">⌕</span><span>Research</span></button>
          <button class="capability-card" onclick="pickPrompt('Help me create an image')" data-prompt="Help me create an image"><span class="capability-icon">✧</span><span>Image creation</span></button>
          <button class="capability-card" onclick="pickPrompt('Help me develop an idea')" data-prompt="Help me develop an idea"><span class="capability-icon">✦</span><span>Ideas &amp; learning</span></button>
        </div>
      </section>
    </section>
    <section id="conversation" class="conversation" hidden></section>
    <div id="backendStatus" hidden>Checking...</div>
    <div id="contentArea" hidden></div>
  </main>
  <nav class="bottom-navigation">
    <button class="bottom-nav-item active" onclick="navClick(this,'chat')" data-panel="chat"><span>◉</span><small>Chat</small></button>
    <button class="bottom-nav-item" onclick="navClick(this,'projects')" data-panel="projects"><span>▣</span><small>Projects</small></button>
    <button class="bottom-nav-item" onclick="navClick(this,'history')" data-panel="history"><span>◷</span><small>History</small></button>
    <button class="bottom-nav-item" onclick="navClick(this,'settings')" data-panel="settings"><span>⚙</span><small>Settings</small></button>
  </nav>
  <div id="notification" hidden></div>
</div>

<script>
function showToast(m){
  var n = document.getElementById('notification');
  if(!n) return;
  n.textContent = m; n.hidden = false;
  setTimeout(function(){ n.hidden = true; }, 2500);
}
function pickPrompt(p){
  var input = document.getElementById('messageInput');
  if(input){ input.value = p; input.focus(); }
  showToast('Prompt imewekwa - bonyeza Send');
}
function navClick(btn, panel){
  document.querySelectorAll('.bottom-nav-item').forEach(function(x){ x.classList.remove('active'); });
  btn.classList.add('active');
  if(panel === 'chat'){
    var w = document.getElementById('welcomeArea');
    var c = document.getElementById('conversation');
    if(w) w.style.display = 'block';
    if(c) c.style.display = 'flex';
  } else {
    showToast(panel + ' - coming soon');
  }
}
function sendMsg(){
  var input = document.getElementById('messageInput');
  var convo = document.getElementById('conversation');
  var welcome = document.getElementById('welcomeArea');
  var text = input.value.trim();
  if(!text){ showToast('Andika kitu kwanza'); return; }
  if(welcome) welcome.style.display = 'none';
  if(convo){ convo.hidden = false; convo.style.display = 'flex'; }
  var my = document.createElement('div');
  my.textContent = text;
  my.style.cssText = 'align-self:flex-end;background:#fff;color:#000;padding:12px 16px;border-radius:18px 18px 4px 18px;max-width:85%;font-size:15px;line-height:1.5;white-space:pre-wrap';
  convo.appendChild(my);
  input.value = '';
  var ai = document.createElement('div');
  ai.textContent = 'THEURIQ inafikiria...';
  ai.style.cssText = 'align-self:flex-start;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#fff;padding:12px 16px;border-radius:18px 18px 18px 4px;max-width:85%;font-size:15px;line-height:1.5;white-space:pre-wrap';
  convo.appendChild(ai);
  window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
  setTimeout(function(){
    ai.textContent = 'Nimepokea: "' + text + '"\n\nUI sasa inafanya kazi! Backend ikiconnect nitakujibu kama AI kamili.';
  }, 800);
}
window.addEventListener('load', function(){
  setTimeout(function(){ showToast('App ime-load vizuri ✅'); }, 800);
  var input = document.getElementById('messageInput');
  if(input){
    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); }
    });
  }
});
</script>
</body>
  </html>

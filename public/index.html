
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050611">
  <meta name="description" content="THEURIQ-AI Intelligence Studio">
  <title>THEURIQ-AI | Intelligence Studio</title>

  <style>
    :root {
      --bg: #050611;
      --panel: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.12);
      --accent: #7c5cff;
      --accent2: #00e5ff;
      --text: #ffffff;
      --muted: #a1a1b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(600px 400px at 15% 5%, rgba(124,92,255,.38), transparent 60%),
        radial-gradient(500px 400px at 85% 15%, rgba(0,229,255,.22), transparent 60%),
        radial-gradient(700px 500px at 50% 110%, rgba(255,61,138,.18), transparent 60%),
        linear-gradient(180deg,#050611,#080916,#050611);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    button, textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app-container {
      max-width: 780px;
      margin: 0 auto;
      padding: 0 16px 100px;
      position: relative;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg,var(--accent),var(--accent2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 21px;
      box-shadow: 0 0 25px rgba(124,92,255,.4);
    }

    .brand-name {
      font-weight: 800;
      letter-spacing: .5px;
      font-size: 17px;
    }

    .icon-button {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: white;
      font-size: 20px;
    }

    .welcome-area {
      padding-top: 35px;
      text-align: center;
    }

    .welcome-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--muted);
      font-weight: 700;
      margin-bottom: 13px;
    }

    .welcome-area h1 {
      font-size: 34px;
      line-height: 1.15;
      font-weight: 800;
      background: linear-gradient(90deg,#fff,#a78bfa,#00e5ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .welcome-area p {
      color: var(--muted);
      margin-top: 12px;
      font-size: 15px;
      line-height: 1.6;
    }

    .composer {
      margin-top: 26px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 13px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 50px rgba(0,0,0,.3);
      text-align: left;
    }

    .composer textarea {
      width: 100%;
      min-height: 55px;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 15px;
      resize: none;
      padding: 5px;
    }

    .composer textarea::placeholder {
      color: #8b8b9e;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 9px;
    }

    .composer-tools {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tool-button {
      background: rgba(255,255,255,.08);
      border: 1px solid var(--border);
      color: white;
      padding: 8px 13px;
      border-radius: 999px;
      font-size: 13px;
    }

    .model-label {
      font-size: 10px;
      letter-spacing: .5px;
      color: #c4c4d6;
      font-weight: 600;
    }

    .send-button {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: white;
      color: black;
      font-size: 22px;
      font-weight: 800;
    }

    .explore-section {
      margin-top: 30px;
      text-align: left;
    }

    .explore-section h2 {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--muted);
      margin-bottom: 13px;
    }

    .capability-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .capability-card {
      min-height: 65px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 13px;
      color: white;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      font-size: 13px;
    }

    .capability-card:active {
      transform: scale(.97);
    }

    .capability-icon {
      font-size: 19px;
    }

    .conversation {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 20px;
    }

    .message {
      max-width: 95%;
      padding: 13px 15px;
      border-radius: 15px;
      line-height: 1.6;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg,#6045d8,#4933a8);
      border-bottom-right-radius: 4px;
    }

    .message.assistant {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .message.error {
      border-color: rgba(255,80,80,.5);
    }

    #otherPanel {
      margin-top: 25px;
      padding: 22px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 17px;
      min-height: 180px;
    }

    #otherPanel h2 {
      font-size: 22px;
      margin-bottom: 12px;
    }

    #otherPanel p {
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .bottom-navigation {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(5,6,17,.94);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 11px 0 calc(11px + env(safe-area-inset-bottom));
      z-index: 10;
    }

    .bottom-nav-item {
      background: none;
      border: none;
      color: #8b8b9e;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      min-width: 55px;
    }

    .bottom-nav-item.active {
      color: white;
    }

    .bottom-nav-item span {
      font-size: 19px;
    }

    #notification {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      padding: 11px 17px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      z-index: 60;
      max-width: 90%;
      text-align: center;
    }

    .menu-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 30;
    }

    .menu-overlay.open {
      display: block;
    }

    .side-menu {
      width: min(290px,85vw);
      height: 100%;
      background: #101321;
      border-right: 1px solid var(--border);
      padding: 24px 17px;
      animation: slideIn .2s ease;
    }

    @keyframes slideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }

    .menu-heading {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 25px;
    }

    .menu-item {
      width: 100%;
      display: block;
      text-align: left;
      padding: 14px;
      margin: 5px 0;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: white;
      font-size: 14px;
    }

    .menu-item:active,
    .menu-item:hover {
      background: var(--panel);
      border-color: var(--border);
    }

    [hidden] {
      display: none !important;
    }

    @media (min-width: 600px) {
      .welcome-area {
        padding-top: 55px;
      }

      .welcome-area h1 {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">

    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">T</div>
        <div class="brand-name">THEURIQ-AI</div>
      </div>

      <button
        id="menuToggle"
        class="icon-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
      >☰</button>
    </header>

    <main>

      <section class="welcome-area" id="welcomeArea">

        <div class="welcome-label">
          YOUR PERSONAL INTELLIGENCE STUDIO
        </div>

        <h1>What can I help you build?</h1>

        <p>
          Think bigger. Explore ideas.<br>
          Create something extraordinary.
        </p>

        <div class="composer" id="composer">

          <textarea
            id="messageInput"
            placeholder="Ask THEURIQ anything..."
            rows="2"
          ></textarea>

          <div class="composer-footer">

            <div class="composer-tools">
              <button
                id="attachButton"
                class="tool-button"
                type="button"
              >＋ Attach</button>

              <span class="model-label">AI MODEL: AUTO</span>
            </div>

            <button
              id="sendButton"
              class="send-button"
              type="button"
              aria-label="Send message"
            >↑</button>

          </div>
        </div>

        <section class="explore-section">
          <h2>EXPLORE THE POSSIBILITIES</h2>

          <div class="capability-grid">

            <button
              class="capability-card"
              type="button"
              data-prompt="Help me write code for a software project"
            >
              <span class="capability-icon">⌘</span>
              <span>Coding</span>
            </button>

            <button
              class="capability-card"
              type="button"
              data-prompt="Help me research a topic in detail"
            >
              <span class="capability-icon">⌕</span>
              <span>Research</span>
            </button>

            <button
              class="capability-card"
              type="button"
              data-prompt="Help me create an image"
            >
              <span class="capability-icon">✧</span>
              <span>Image creation</span>
            </button>

            <button
              class="capability-card"
              type="button"
              data-prompt="Help me develop and improve an idea"
            >
              <span class="capability-icon">✦</span>
              <span>Ideas &amp; learning</span>
            </button>

          </div>
        </section>
      </section>

      <section
        id="conversation"
        class="conversation"
        hidden
      ></section>

      <section id="otherPanel" hidden></section>

    </main>

    <nav class="bottom-navigation">

      <button
        class="bottom-nav-item active"
        type="button"
        data-panel="chat"
      >
        <span>◉</span>
        <small>Chat</small>
      </button>

      <button
        class="bottom-nav-item"
        type="button"
        data-panel="projects"
      >
        <span>▣</span>
        <small>Projects</small>
      </button>

      <button
        class="bottom-nav-item"
        type="button"
        data-panel="history"
      >
        <span>◷</span>
        <small>History</small>
      </button>

      <button
        class="bottom-nav-item"
        type="button"
        data-panel="settings"
      >
        <span>⚙</span>
        <small>Settings</small>
      </button>

    </nav>

    <div id="notification" hidden></div>

  </div>

  <div id="menuOverlay" class="menu-overlay">

    <div class="side-menu">

      <div class="menu-heading">THEURIQ-AI MENU</div>

      <button class="menu-item" type="button" data-action="new">
        ＋ New conversation
      </button>

      <button class="menu-item" type="button" data-action="chat">
        ◉ AI Assistant
      </button>

      <button class="menu-item" type="button" data-action="projects">
        ▣ My Projects
      </button>

      <button class="menu-item" type="button" data-action="history">
        ◷ Conversation History
      </button>

      <button class="menu-item" type="button" data-action="settings">
        ⚙ Settings
      </button>

      <button class="menu-item" type="button" data-action="close">
        ✕ Close menu
      </button>

    </div>
  </div>

  <script src="/js/app.js" defer></script>

</body>
</html>
